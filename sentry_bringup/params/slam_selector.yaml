# SLAM Algorithm Selector Configuration
# 选择使用的SLAM算法: 'fast_lio' 或 'point_lio'
# Point-LIO对退化运动更鲁棒，适合mid360
slam_algorithm: 'fast_lio'  # Options: 'fast_lio', 'point_lio'

# 根据选择的算法，系统会自动加载对应的参数文件：
# fast_lio:
#   - mapping: fast_lio_mapping_param.yaml
#   - relocalization: fast_lio_relocalization_param.yaml
# point_lio:
#   - mapping: point_lio_mapping_param.yaml
#   - relocalization: point_lio_relocalization_param.yaml
