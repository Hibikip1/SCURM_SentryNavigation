# icp_node 参数示例（与 src/icp_node.cpp 中 declare_parameter 一一对应）
#
# 判定逻辑：不再使用 PCL 的 getFitnessScore()。
#   它返回的是"所有源点最近邻距离平方的平均值"，没有上限、没有内点比例，
#   一个肉眼完全对齐的结果只要有 5% 的点落在先验地图之外就会到 2.0 以上，
#   跟固定阈值比较没有任何意义。
#   现在用：内点率 + 内点 RMSE + 最近邻中位数 三个条件同时满足。

icp_node:
  ros__parameters:
    # 初始位姿（相对于先验地图 map 坐标系）
    initial_x: 0.0
    initial_y: 0.0
    initial_z: 0.0
    initial_a: 0.0

    # 地图
    map_path: "/home/lab/sentry_ws/test.pcd"
    map_frame_id: "map"
    map_voxel_leaf_size: 0.2      # 必须 <= 精细层对应距离，否则拿不到足够对应点

    # 扫描
    cloud_voxel_leaf_size: 0.2

    # 多分辨率 ICP：由粗到细，第一级要 >= 初值可能的误差
    correspondence_levels: [1.0, 0.5, 0.25]
    solver_max_iter: 30           # 每一级对应距离的迭代次数
    max_correspondence_distance: 0.5   # 未设置 correspondence_levels 时的兜底
    RANSAC_outlier_rejection_threshold: 0.5   # RANSAC 迭代数为 0，实际不生效

    # 质量判定
    blind: 0.5                    # 近处裁剪半径，去掉机器人自身的点
    inlier_dist: 0.2              # 最近邻 < 0.2 m 记为内点
    min_inlier_ratio: 0.65        # 内点率下限
    max_rmse: 0.15                # 内点 RMSE 上限 (m)
    max_median_dist: 0.15         # 最近邻中位数上限 (m)，用来卡住"原地转错角度"
    converged_count_thre: 5       # 连续 N 帧达标才发布

    # 传感器
    pcl_type: "livox"             # livox: 订阅 /livox/lidar(CustomMsg)；其它: /pointcloud2
